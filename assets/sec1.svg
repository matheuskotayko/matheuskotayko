<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Chapter 1: Origin"><title>Chapter 1: Origin</title><defs>
<filter id="brush" x="-10%" y="-30%" width="120%" height="160%">
  <feTurbulence type="fractalNoise" baseFrequency=".035 .9" numOctaves="3" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
</filter>
<filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency=".012 .05" numOctaves="4" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="40"/>
  <feGaussianBlur stdDeviation="1.2"/>
</filter>
<filter id="grain">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/>
  <feColorMatrix values="0 0 0 0 .6  0 0 0 0 .75  0 0 0 0 1  0 0 0 .07 0"/>
</filter>
<radialGradient id="light" cx=".18" cy=".05" r=".9">
  <stop offset="0" stop-color="#9cc4ff" stop-opacity=".55"/>
  <stop offset=".25" stop-color="#2f6fd6" stop-opacity=".28"/>
  <stop offset=".6" stop-color="#2f6fd6" stop-opacity="0"/>
</radialGradient>
<linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#e8f0ff" stop-opacity="0"/>
  <stop offset=".35" stop-color="#e8f0ff" stop-opacity=".95"/>
  <stop offset="1" stop-color="#9cc4ff" stop-opacity=".15"/>
</linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#2f6fd6"/>
  <stop offset="1" stop-color="#2f6fd6" stop-opacity="0"/>
</linearGradient>
