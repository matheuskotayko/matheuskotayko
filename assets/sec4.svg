<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Chapter 4: Arsenal"><title>Chapter 4: Arsenal</title><defs>
<filter id="brush" x="-10%" y="-30%" width="120%" height="160%">
